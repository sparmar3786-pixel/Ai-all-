name: Build AI-All Artifact

on:
  push:
    branches: [main]
    paths:
      - ai-trading-source.zip
      - android-native/**
      - .github/workflows/build-artifact.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-all-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-apk:
    name: Build native Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable debug APK
        working-directory: android-native
        run: gradle --no-daemon assembleDebug

      - name: Verify APK exists
        run: test -s android-native/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-all-native-android-apk
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  web-artifact:
    name: Build existing web source artifact
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download source archive when not committed
        env:
          SOURCE_ARCHIVE_URL: https://my-app-algotrading.floot.app/_cdn/static/ceae26de-6179-48ad-9650-d8f9f30ec54d-ai-trading-source.zip
        run: |
          set -euo pipefail
          if [ ! -s ai-trading-source.zip ]; then
            echo "Source ZIP absent from Git; downloading the prepared source archive."
            curl --fail --location --retry 3 --retry-delay 2 "$SOURCE_ARCHIVE_URL" --output ai-trading-source.zip
          fi
          test -s ai-trading-source.zip
          unzip -tq ai-trading-source.zip

      - name: Verify and extract source archive
        run: |
          set -euo pipefail
          mkdir -p source
          unzip -q ai-trading-source.zip -d source
          test -f source/README.md

      - name: Detect web project
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          if [ -f source/package.json ] && [ -f source/vendor/TradingGoose/package.json ]; then
            echo "kind=web" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Source archive does not contain the expected Vite web project."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build React/Vite web app
        working-directory: source
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run build
          test -s vendor/TradingGoose/dist/index.html

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-all-web-artifact
          path: source/vendor/TradingGoose/dist/
          if-no-files-found: error
          retention-days: 14
